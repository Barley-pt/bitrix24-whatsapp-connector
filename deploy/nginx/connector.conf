# YOUR_DOMAIN -> Cloudflare Worker `bitrix-whatsapp-connector`
#
# TEMPLATE. The live copy lives at /etc/nginx/sites-available/connector on the edge server
# and carries the real EDGE_SECRET, so it is not a straight copy of this file.
#
# DNS for YOUR_DOMAIN is not on Cloudflare, so there is no CF custom domain. nginx terminates TLS
# here and reverse-proxies to the workers.dev origin.
#
# IPv4-only upstream resolution (load-bearing, not cosmetic): a static `server host:port;` in an
# upstream{} block resolves once at nginx start/reload and round-robins across every A *and* AAAA
# record returned. This box's IPv6 route to Cloudflare's anycast range is broken, so any request
# that lands on the IPv6 peer fails with "Network is unreachable" - intermittently, since it
# depends on which peer nginx picks. A $variable in proxy_pass forces per-request resolution
# through the `resolver` directive instead, and `ipv6=off` keeps that resolution to A records only.
# Trade-off: this drops the upstream{} block's keepalive connection pool. Negligible at current
# traffic; revisit if volume grows enough for per-request TLS handshake cost to matter.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # certbot writes its challenge here before the redirect applies.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Combined listen+http2 form rather than the newer standalone `http2 on;` directive
    # (nginx 1.25.1+ only): the edge server runs an older nginx that rejects it as unknown.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # See the IPv4-only note above. 1.1.1.1/1.0.0.1 rather than a local resolver so this does not
    # depend on whatever DNS the box's own IPv6-broken network stack would otherwise hand back.
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # WhatsApp media relayed through the webhook (phase 3).
    client_max_body_size 32m;

    access_log /var/log/nginx/connector.access.log;
    error_log  /var/log/nginx/connector.error.log;

    location / {
        # A variable, not a literal hostname: literals resolve once via the OS resolver at
        # load time (the broken path above); variables re-resolve per request via `resolver`.
        set $connector_upstream your-worker.your-account.workers.dev;
        proxy_pass          https://$connector_upstream;
        proxy_http_version 1.1;

        # Cloudflare routes by Host, so it must name the workers.dev origin, and SNI must match
        # or the TLS handshake to the edge fails.
        proxy_set_header   Host your-worker.your-account.workers.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name     your-worker.your-account.workers.dev;
        proxy_set_header   Connection "";

        # Cloudflare overwrites CF-Connecting-IP with this VPS address and appends it to
        # X-Forwarded-For, so neither survives as the caller's identity. This header is one
        # Cloudflare leaves alone, and X-Edge-Auth proves the request came through this nginx
        # rather than straight to the workers.dev URL.
        proxy_set_header   X-Real-Client-IP $remote_addr;
        proxy_set_header   X-Edge-Auth      "__EDGE_SECRET__";
        proxy_set_header   X-Forwarded-Proto https;

        # Bitrix24 event handlers and the Wasender webhook are both POST callbacks; give them
        # room without letting a hung upstream pile up workers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }
}
